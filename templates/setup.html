<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Symposium Scheduler — Setup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="mb-0">Screen 3 — Pre-Scheduling Setup</h1>
      <div>
        <a href="/responses" class="btn btn-outline-secondary me-2">Back</a>
        <button form="setup-form" type="submit" class="btn btn-primary">Run Scheduler (Screen 4)</button>
      </div>
    </div>
    <p class="text-muted">Screen 3 of 5: Configure manual settings before generation.</p>

    <form method="post" action="/setup" id="setup-form" class="row g-3">
      <div class="col-12">
        <label class="form-label">Designate presenters for large room (soft preference)</label>
        <div class="border rounded p-2" style="max-height: 260px; overflow:auto;">
          {% if presenter_rows %}
          {% for row in presenter_rows %}
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="{{ row.name }}" name="manual_large_room" id="lr-{{ loop.index0 }}">
            <label class="form-check-label" for="lr-{{ loop.index0 }}">
              {{ row.name }} <span class="text-muted">({{ row.topics }})</span> — <strong>{{ row.large_room }}</strong>
            </label>
          </div>
          {% endfor %}
          {% else %}
          <p class="text-muted mb-0">No presenters marked Yes/Maybe for the large room question.</p>
          {% endif %}
        </div>
      </div>
    </form>
  </div>
</body>
</html>
