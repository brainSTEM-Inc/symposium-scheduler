<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Symposium Scheduler — Edit Response</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="mb-0">Screen 2 — Edit Response</h1>
      <a href="/responses" class="btn btn-outline-secondary">Back to Responses</a>
    </div>

    <form method="post" action="/responses/edit/{{ index }}" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">{{ col_config['name'] }}</label>
        <input class="form-control" name="{{ col_config['name'] }}" value="{{ row[col_config['name']] }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">{{ col_config['title'] }}</label>
        <input class="form-control" name="{{ col_config['title'] }}" value="{{ row[col_config['title']] }}">
      </div>
      <div class="col-12">
        <label class="form-label">{{ col_config['topics'] }}</label>
        <input class="form-control" name="{{ col_config['topics'] }}" value="{{ row[col_config['topics']] }}">
      </div>
      <div class="col-12">
        <label class="form-label">{{ col_config['availability'] }}</label>
        <textarea class="form-control" name="{{ col_config['availability'] }}" rows="2">{{ row[col_config['availability']] }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label">{{ col_config['ppp'] }}</label>
        <input class="form-control" name="{{ col_config['ppp'] }}" value="{{ row[col_config['ppp']] }}">
      </div>
      <div class="col-12">
        <label class="form-label">{{ col_config['bf'] }}</label>
        <input class="form-control" name="{{ col_config['bf'] }}" value="{{ row[col_config['bf']] }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">{{ col_config['large_room'] }}</label>
        <input class="form-control" name="{{ col_config['large_room'] }}" value="{{ row[col_config['large_room']] }}">
      </div>
      <div class="col-md-4">
        <label class="form-label">{{ col_config['present_twice'] }}</label>
        <input class="form-control" name="{{ col_config['present_twice'] }}" value="{{ row[col_config['present_twice']] }}">
      </div>

      <div class="col-12">
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</body>
</html>
