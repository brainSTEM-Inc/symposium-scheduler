<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Symposium Scheduler — Generating</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-3">Screen 4 — Generating Schedules</h1>
    <p class="text-muted">Screen 4 of 5: background optimization running.</p>
    <p class="small text-muted">Engine iterations: {{ num_restarts }} • Candidates: {{ num_results }}</p>

    <div id="status" class="alert alert-secondary">Starting generation...</div>

    <div class="table-responsive">
      <table class="table table-sm">
        <thead>
          <tr>
            <th>Run</th>
            <th>Latest best score</th>
          </tr>
        </thead>
        <tbody id="progress-body"></tbody>
      </table>
    </div>

    <a id="review-link" href="/review" class="btn btn-success d-none">Open Review</a>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const body = document.getElementById('progress-body');
    const reviewLink = document.getElementById('review-link');

    async function refresh() {
      try {
        const resp = await fetch('/api/run_status');
        const data = await resp.json();
        if (data.error) {
          statusEl.className = 'alert alert-danger';
          statusEl.textContent = data.error;
          clearInterval(timer);
          return;
        }

        const entries = data.run_progress || [];
        body.innerHTML = '';
        entries.slice(-12).forEach((entry) => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${entry.run_number ?? ''}</td><td>${entry.best_score ?? 'N/A'}</td>`;
          body.appendChild(row);
        });

        if (data.run_error) {
          statusEl.className = 'alert alert-danger';
          statusEl.textContent = data.run_error;
          clearInterval(timer);
          return;
        }

        if (!data.run_in_progress && data.done) {
          statusEl.className = 'alert alert-success';
          statusEl.textContent = 'Generation complete.';
          reviewLink.className = 'btn btn-success';
          reviewLink.classList.remove('d-none');
          clearInterval(timer);
          return;
        }

        statusEl.textContent = `In progress... Best score: ${data.best_score ?? 'N/A'}`;
      } catch (error) {
        statusEl.className = 'alert alert-danger';
        statusEl.textContent = String(error);
        clearInterval(timer);
      }
    }

    const timer = setInterval(refresh, 1200);
    refresh();
  </script>
</body>
</html>
